name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The unit tests import stripTypeScriptTypes from node:module, which was added in Node
        # 22.13.0; package.json engines and CONTRIBUTING.md both set 22.13+ as the supported
        # floor. Node 18 and 20 cannot run this suite, so they are not in the matrix.
        node: ["22.13.0", "24.x"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step: the project has zero dependencies and the test script is plain Node.
      - name: Check the Pi extension loads
        run: node scripts/check-extension-load.mjs

      - name: Run the unit tests
        run: npm test
